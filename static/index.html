<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Jobs</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/site.css" />
</head>
<body>
  <!-- The job board. Everything in #app is built by static/site.js from /api/jobs, which reads
       scraped_jobs.json, so a new scrape shows up here with no frontend change. -->
  <header class="top">
    <a class="brand" href="#/">AI&nbsp;Jobs</a>
    <input id="q" type="search" placeholder="Search jobs, skills, fields…" aria-label="Search jobs" autocomplete="off" />
  </header>

  <div id="notice" hidden></div>
  <main id="app" aria-live="polite"></main>

  <!-- The assistant. static/voice.js joins a LiveKit room, shows the avatar's video here, plays its
       voice, and forwards every message the agent sends (topic "ui") to one SITE method in site.js. -->
  <aside id="assistant" aria-label="Voice assistant">
    <div class="stage">
      <video id="avatar-video" autoplay playsinline></video>
      <div class="placeholder">
        <div class="orb" aria-hidden="true"></div>
        <p class="hello">Tell me what you're looking for</p>
        <p class="hello-sub">I'll search the jobs and open the right one for you.</p>
      </div>
      <button id="sound-btn" type="button" hidden>Tap to hear the assistant</button>
    </div>
    <div class="bar">
      <span id="voice-dot" title="Lights up while LiveKit is receiving your microphone"></span>
      <span id="voice-label">Talk to your job assistant</span>
      <button id="voice-btn" type="button">Start</button>
    </div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script src="/static/site.js"></script>
  <script src="/static/voice.js"></script>
</body>
</html>
